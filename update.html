<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>업데이트 내역 | 로엔 야생</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
    --bg:#0b0d10;
    --card:#111317;
    --card-hover:#15181d;
    --border:#252930;
    --text:#f2f4f7;
    --muted:#8b939f;
    --accent:#8d82ff;
}
html{scroll-behavior:smooth}
body{
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
}
a{color:inherit;text-decoration:none}
main{width:min(1000px,calc(100% - 40px));margin:auto;padding:42px 0 70px}
.topbar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:52px;
}
.brand{font-size:14px;font-weight:650}
.back{font-size:13px;color:var(--muted)}
.back:hover{color:var(--text)}

.hero{margin-bottom:34px}
.eyebrow{
    color:var(--accent);
    font-size:11px;
    font-weight:700;
    letter-spacing:1.4px;
    margin-bottom:9px;
}
h1{
    font-size:36px;
    line-height:1.2;
    letter-spacing:-1.5px;
}
.hero p{
    margin-top:10px;
    color:var(--muted);
    font-size:14px;
    line-height:1.65;
}

.featured{
    margin-bottom:36px;
    padding:26px 28px;
    border:1px solid var(--border);
    border-radius:14px;
    background:var(--card);
}
.meta{
    display:flex;
    align-items:center;
    flex-wrap:wrap;
    gap:9px;
    color:var(--muted);
    font-size:12px;
}
.badge{
    padding:4px 8px;
    border:1px solid #3a3e48;
    border-radius:999px;
    color:var(--text);
    font-size:11px;
}
.featured h2{
    margin-top:17px;
    font-size:22px;
    line-height:1.4;
    letter-spacing:-.7px;
}
.summary{
    margin-top:8px;
    color:var(--muted);
    font-size:13px;
    line-height:1.65;
}
.open{
    display:inline-flex;
    margin-top:20px;
    font-size:13px;
}
.open::after{
    content:"›";
    margin-left:7px;
    color:var(--muted);
}

.section-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding-bottom:12px;
    border-bottom:1px solid var(--border);
}
.section-head h2{font-size:15px}
.section-head span{font-size:12px;color:var(--muted)}

.update-table{
    width:100%;
    border-collapse:collapse;
    table-layout:fixed;
}
.update-table .date-col{width:82px}
.update-table .author-col{width:110px}
.update-table tr{
    border-bottom:1px solid var(--border);
    cursor:pointer;
    transition:background .15s ease;
}
.update-table tbody tr:hover{background:var(--card-hover)}
.update-table td{
    padding:19px 10px;
    vertical-align:middle;
}
.date{font-size:12px;color:var(--muted)}
.update-title{font-size:14px;font-weight:600;line-height:1.5}
.update-summary{
    margin-top:5px;
    color:var(--muted);
    font-size:12px;
    line-height:1.55;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}
.author{
    text-align:right;
    color:var(--muted);
    font-size:11px;
}
.author strong{
    display:block;
    color:var(--text);
    font-size:12px;
    font-weight:500;
    margin-bottom:3px;
}

/* detail */
#detailView{display:none}
.detail-back{
    display:inline-block;
    margin-bottom:26px;
    color:var(--muted);
    font-size:13px;
}
.detail-back:hover{color:var(--text)}
.detail-meta{font-size:12px;color:var(--muted)}
.detail-title{
    margin-top:10px;
    font-size:34px;
    line-height:1.3;
    letter-spacing:-1.3px;
}
.detail-summary{
    max-width:850px;
    margin-top:12px;
    color:var(--muted);
    font-size:14px;
    line-height:1.75;
}
.detail-section{margin-top:32px}
.detail-section h2{
    padding-bottom:12px;
    border-bottom:1px solid var(--border);
    font-size:18px;
}
.detail-section p{
    margin-top:15px;
    color:#b7bec8;
    font-size:13px;
    line-height:1.8;
}
.detail-section ul{
    margin-top:14px;
    padding-left:19px;
    color:#aeb6c1;
    font-size:13px;
    line-height:1.85;
}
.change-table{
    width:100%;
    margin-top:14px;
    border-collapse:collapse;
    border:1px solid var(--border);
}
.change-table th,
.change-table td{
    padding:13px 14px;
    border:1px solid var(--border);
    text-align:left;
    font-size:12px;
}
.change-table th{
    background:#101216;
    color:var(--text);
    font-weight:600;
}
.change-table td{color:var(--muted)}
.change-table td:last-child{color:var(--text)}

.error{
    padding:24px;
    border:1px solid var(--border);
    border-radius:14px;
    background:var(--card);
    color:var(--muted);
    font-size:13px;
    line-height:1.7;
}
footer{
    padding:0 20px 30px;
    text-align:center;
    color:#626a75;
    font-size:12px;
}

@media(max-width:640px){
    main{width:calc(100% - 24px);padding-top:30px}
    h1{font-size:30px}
    .detail-title{font-size:28px}
    .featured{padding:22px}
    .update-table .date-col{width:62px}
    .update-table .author-col{width:72px}
    .update-table td{padding:16px 6px}
    .update-summary{display:none}
    .author{font-size:0}
    .author strong{font-size:11px}
    .change-table th,.change-table td{
        padding:10px 8px;
        font-size:11px;
    }
}
</style>
</head>
<body>

<main>
<header class="topbar">
    <a href="index.html" class="brand">로엔 야생</a>
    <a href="index.html" class="back">← 메인으로</a>
</header>

<section id="listView">
    <div class="hero">
        <div class="eyebrow">PORTAL 03</div>
        <h1>업데이트 내역</h1>
        <p>서버에 적용된 업데이트와 변경 사항을 확인하세요.</p>
    </div>

    <article id="featured"></article>

    <section>
        <div class="section-head">
            <h2>지난 패치</h2>
            <span id="count"></span>
        </div>

        <table class="update-table">
            <colgroup>
                <col class="date-col">
                <col>
                <col class="author-col">
            </colgroup>
            <tbody id="updateList"></tbody>
        </table>
    </section>
</section>

<section id="detailView">
    <a href="update.html" class="detail-back">← 업데이트 목록</a>
    <div id="detailMeta" class="detail-meta"></div>
    <h1 id="detailTitle" class="detail-title"></h1>
    <p id="detailSummary" class="detail-summary"></p>
    <div id="detailContent"></div>
</section>
</main>

<footer>2026 Roen. <strong>All rights reserved.</strong></footer>

<script>
let updates = [];

async function loadUpdates(){
    try{
        const response = await fetch("./updates.json", {
            cache: "no-store"
        });

        if(!response.ok){
            throw new Error("updates.json load failed");
        }

        updates = await response.json();

        const id = new URLSearchParams(location.search).get("id");

        if(id){
            showDetail(id);
        }else{
            renderList();
        }
    }catch(error){
        document.getElementById("listView").innerHTML = `
            <div class="error">
                <strong>업데이트를 불러올 수 없습니다.</strong><br>
                updates.json이 update.html과 같은 위치에 있는지 확인해주세요.
            </div>
        `;
    }
}

function renderList(){
    document.getElementById("listView").style.display = "block";
    document.getElementById("detailView").style.display = "none";

    const featured = updates.find(item => item.featured);
    const previous = updates.filter(item => !item.featured);

    if(featured){
        document.getElementById("featured").innerHTML = `
            <article class="featured">
                <div class="meta">
                    <span class="badge">최신 패치</span>
                    <span>${esc(featured.author)}</span>
                    <span>#${esc(featured.id)}</span>
                    <span>${esc(featured.date)}</span>
                </div>

                <h2>${esc(featured.title)}</h2>

                <p class="summary">${esc(featured.summary)}</p>

                <a class="open"
                   href="?id=${encodeURIComponent(featured.id)}">
                    전체 내용 보기
                </a>
            </article>
        `;
    }

    document.getElementById("count").textContent =
        `${previous.length}건`;

    document.getElementById("updateList").innerHTML =
        previous.map(item => `
            <tr onclick="location.href='?id=${encodeURIComponent(item.id)}'">
                <td class="date">${esc(item.date.slice(5))}</td>

                <td>
                    <div class="update-title">
                        ${esc(item.title)}
                    </div>
                    <div class="update-summary">
                        ${esc(item.summary)}
                    </div>
                </td>

                <td class="author">
                    <strong>${esc(item.author)}</strong>
                    #${esc(item.id)}
                </td>
            </tr>
        `).join("");
}

function showDetail(id){
    const item = updates.find(update => update.id === id);

    if(!item){
        location.href = "update.html";
        return;
    }

    document.getElementById("listView").style.display = "none";
    document.getElementById("detailView").style.display = "block";

    document.getElementById("detailMeta").textContent =
        `#${item.id} · ${item.author} · ${item.date}`;

    document.getElementById("detailTitle").textContent =
        item.title;

    document.getElementById("detailSummary").textContent =
        item.summary;

    document.getElementById("detailContent").innerHTML =
        item.sections.map(section => {
            let html = `
                <section class="detail-section">
                    <h2>${esc(section.title)}</h2>
            `;

            if(section.text){
                html += `<p>${esc(section.text)}</p>`;
            }

            if(section.items){
                html += `
                    <ul>
                        ${section.items.map(item =>
                            `<li>${esc(item)}</li>`
                        ).join("")}
                    </ul>
                `;
            }

            if(section.table){
                html += `
                    <table class="change-table">
                        <thead>
                            <tr>
                                ${section.table.headers.map(header =>
                                    `<th>${esc(header)}</th>`
                                ).join("")}
                            </tr>
                        </thead>
                        <tbody>
                            ${section.table.rows.map(row => `
                                <tr>
                                    ${row.map(cell =>
                                        `<td>${esc(cell)}</td>`
                                    ).join("")}
                                </tr>
                            `).join("")}
                        </tbody>
                    </table>
                `;
            }

            return html + `</section>`;
        }).join("");

    document.title = `${item.title} | 로엔 야생`;
}

function esc(value){
    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}

loadUpdates();
</script>
</body>
</html>
